name: Check radar publication hygiene

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-radar-public:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check public radar HTML and repository hygiene
        run: node tools/check-radar-public.js
