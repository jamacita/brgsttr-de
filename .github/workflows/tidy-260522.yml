name: Tidy 260522

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: git rm -f cleanup_final_260522.py cleanup_home_260522.py test_path_260522.py note_260522.txt ping_260522.txt .github/workflows/run-final-cleanup-260522.yml .github/workflows/tidy-260522.yml || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Tidy BRGSTTR temporary files" || exit 0
          git push
